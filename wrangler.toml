name = "remaker-ai"
main = "worker.js"
compatibility_date = "2024-09-23"

# Copia soltanto le pagine e le risorse pubbliche.
[build]
command = "node build-assets.mjs"

[assets]
directory = "./dist"
binding = "ASSETS"

# La chiave Gemini NON va qui — usare:
#   wrangler secret put GEMINI_API_KEY
# e incollare la chiave quando richiesto.
# Alternativamente (dashboard Cloudflare):
# Workers & Pages → remaker-ai → Settings → Variables and Secrets → GEMINI_API_KEY

# Route del Worker (già configurata su Cloudflare)
# workers_dev = true   → disponibile su remaker-ai.roberto-faccenda.workers.dev
